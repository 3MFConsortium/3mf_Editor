name: Build Java JAR

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Compile Java source
      run: |
        cd 3MF
        mkdir -p bin
        javac -cp "jar/*" -d bin -sourcepath src src/com/qualitylogic/x3mf/*.java
        
    - name: Copy resources
      run: |
        cd 3MF
        cp -r src/resources bin/
        
    - name: Extract dependency JARs
      run: |
        cd 3MF
        mkdir -p extracted-deps
        for jar in jar/*.jar; do
          unzip -o -q "$jar" -d extracted-deps/ || true
        done
        # Remove signature files to avoid conflicts
        rm -rf extracted-deps/META-INF/*.SF
        rm -rf extracted-deps/META-INF/*.DSA
        rm -rf extracted-deps/META-INF/*.RSA
        
    - name: Merge dependencies with compiled code
      run: |
        cd 3MF
        # Copy extracted dependencies to bin
        cp -r extracted-deps/* bin/
        
    - name: Create self-contained JAR manifest
      run: |
        cd 3MF
        mkdir -p bin/META-INF
        cat > bin/META-INF/MANIFEST.MF << EOF
        Manifest-Version: 1.0
        Main-Class: com.qualitylogic.x3mf.StartUp
        EOF
        
    - name: Create self-contained JAR file
      run: |
        cd 3MF
        jar cfm 3MFedit.jar bin/META-INF/MANIFEST.MF -C bin .
        
    - name: Test JAR is executable
      run: |
        cd 3MF
        java -jar 3MFedit.jar --help || echo "JAR created successfully (help output may not be available)"
        
    - name: Upload self-contained JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3MFedit-standalone
        path: 3MF/3MFedit.jar
        retention-days: 30
