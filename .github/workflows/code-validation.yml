name: Code Validation

on: [pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Verify Java source compilation
      run: |
        cd 3MF
        mkdir -p bin
        javac -Xlint:all -Werror -cp "jar/*" -d bin -sourcepath src src/com/qualitylogic/x3mf/*.java
      continue-on-error: true
      id: compile_strict
        
    - name: Compile with warnings (non-blocking)
      if: steps.compile_strict.outcome == 'failure'
      run: |
        cd 3MF
        mkdir -p bin
        javac -Xlint:all -cp "jar/*" -d bin -sourcepath src src/com/qualitylogic/x3mf/*.java
        
    - name: Check for common code issues
      run: |
        echo "Checking for common code patterns..."
        
        # Check for System.out.println (should use logger)
        if grep -r "System\.out\.println" 3MF/src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  Warning: Found System.out.println statements. Consider using logger instead."
        fi
        
        # Check for System.err.println
        if grep -r "System\.err\.println" 3MF/src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  Warning: Found System.err.println statements. Consider using logger instead."
        fi
        
        # Check for printStackTrace
        if grep -r "\.printStackTrace()" 3MF/src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  Warning: Found printStackTrace() calls. Consider proper exception logging."
        fi
        
        # Check for TODO comments
        if grep -r "TODO" 3MF/src/ --include="*.java" | grep -v "//.*//"; then
          echo "ℹ️  Info: Found TODO comments in code."
        fi
        
        echo "Code pattern check completed."
        
    - name: Check code formatting
      run: |
        echo "Checking basic code formatting..."
        
        # Check for tabs vs spaces consistency
        if grep -P '\t' 3MF/src/**/*.java > /dev/null 2>&1; then
          echo "ℹ️  Info: Code uses tabs for indentation."
        fi
        
        # Check for trailing whitespace
        if grep -r ' $' 3MF/src/ --include="*.java" > /dev/null 2>&1; then
          echo "⚠️  Warning: Found trailing whitespace in Java files."
        fi
        
        echo "Formatting check completed."
        
    - name: Verify required files
      run: |
        echo "Verifying project structure..."
        
        # Check for required directories
        [ -d "3MF/src" ] && echo "✓ Source directory exists"
        [ -d "3MF/jar" ] && echo "✓ JAR dependencies directory exists"
        [ -d "3MF/src/resources" ] && echo "✓ Resources directory exists"
        
        # Check for required dependencies
        [ -f "3MF/jar/commons-cli-1.4.jar" ] && echo "✓ commons-cli dependency found"
        [ -f "3MF/jar/commons-compress-1.12.jar" ] && echo "✓ commons-compress dependency found"
        [ -f "3MF/jar/commons-io-2.5.jar" ] && echo "✓ commons-io dependency found"
        [ -f "3MF/jar/commons-lang3-3.3.2.jar" ] && echo "✓ commons-lang3 dependency found"
        [ -f "3MF/jar/commons-logging-1.2.jar" ] && echo "✓ commons-logging dependency found"
        
        echo "Project structure verification completed."
        
    - name: Count source files
      run: |
        echo "Project statistics:"
        echo "Java files: $(find 3MF/src -name '*.java' | wc -l)"
        echo "Total lines of code: $(find 3MF/src -name '*.java' -exec cat {} \; | wc -l)"
        
    - name: Check for security issues
      run: |
        echo "Checking for potential security issues..."
        
        # Check for hardcoded passwords or keys
        if grep -ri "password\s*=\s*['\"]" 3MF/src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  Warning: Potential hardcoded password found."
        fi
        
        # Check for SQL injection vulnerabilities
        if grep -r "executeQuery.*+.*\"" 3MF/src/ --include="*.java" | grep -v "//"; then
          echo "⚠️  Warning: Potential SQL injection vulnerability (string concatenation in query)."
        fi
        
        # Check for file path traversal
        if grep -r "\.\./" 3MF/src/ --include="*.java" | grep -v "//.*//"; then
          echo "ℹ️  Info: Found relative path references. Verify path traversal protection."
        fi
        
        echo "Security check completed."
        
    - name: Validation Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Code Validation Summary"
        echo "=========================================="
        echo "Compilation: ${{ steps.compile_strict.outcome == 'success' && '✓ Passed with no warnings' || '⚠️  Passed with warnings' }}"
        echo "=========================================="

  veracode-scan:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev_editor'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Build JAR for scanning
      run: |
        cd 3MF
        mkdir -p bin
        javac -cp "jar/*" -d bin -sourcepath src src/com/qualitylogic/x3mf/*.java
        cp -r src/resources bin/
        mkdir -p META-INF
        cat > META-INF/MANIFEST.MF << EOF
        Manifest-Version: 1.0
        Main-Class: com.qualitylogic.x3mf.StartUp
        Class-Path: jar/commons-cli-1.4.jar jar/commons-compress-1.12.jar jar/commons-io-2.5.jar jar/commons-lang3-3.3.2.jar jar/commons-logging-1.2.jar jar/commons-validator-1.6.jar jar/j3d-core-1.5.2.jar jar/vecmath-1.5.2.jar
        EOF
        jar cfm 3MFedit.jar META-INF/MANIFEST.MF -C bin .
        
    - name: Create Veracode package
      run: |
        cd 3MF
        mkdir -p veracode-package
        cp 3MFedit.jar veracode-package/
        cp jar/*.jar veracode-package/
        cd veracode-package
        zip -r ../3MFedit-veracode.zip .
        
    - name: Veracode Upload and Scan
      uses: veracode/veracode-uploadandscan-action@0.2.6
      with:
        appname: '3MF Editor'
        createprofile: true
        filepath: '3MF/3MFedit-veracode.zip'
        vid: '${{ secrets.VERACODE_API_ID }}'
        vkey: '${{ secrets.VERACODE_API_KEY }}'
        scantimeout: 15
      continue-on-error: true
      
    - name: Upload Veracode package as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: veracode-package
        path: 3MF/3MFedit-veracode.zip
        retention-days: 30
